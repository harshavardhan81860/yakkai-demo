version: "3.9"

services:
  # ── PostgreSQL ──
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloudforge
      POSTGRES_USER: cloudforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudforge_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U cloudforge" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Backend: FastAPI ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cloudforge:${POSTGRES_PASSWORD:-cloudforge_secret}@postgres:5432/cloudforge
      SECRET_KEY: ${SECRET_KEY:-super-secret-key-change-in-production-2024}
      CORS_ORIGINS: '["http://localhost:8080","http://localhost:3000"]'
    ports:
      - "8000:8000"

  # ── Frontend: React + Nginx ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "" # Empty = use relative /api/ (nginx proxies to backend)
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
