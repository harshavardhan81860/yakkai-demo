name: Frontend CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'  # Only trigger if files in the frontend folder change
      - 'helm/yaakai/templates/**'
env:
  FRONTEND_IMAGE_NAME: "ghcr.io/${{ github.repository_owner }}/yakkai-frontend"

permissions:
  contents: write
  packages: write  

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }} # Uses your PAT upfront to handle the git push later flawlessly

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # Enables high-performance multi-layer caching mechanisms

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend
        run: |
          echo "Building frontend image with BUILD_SCRIPT=build:dev"
          docker build --build-arg BUILD_SCRIPT=build:dev -t ${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }} -t ${{ env.FRONTEND_IMAGE_NAME }}:latest ./frontend
          docker push ${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.FRONTEND_IMAGE_NAME }}:latest
