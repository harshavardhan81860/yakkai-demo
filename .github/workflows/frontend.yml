name: Frontend CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'  # Only trigger if files in the frontend folder change
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }} # Uses your PAT upfront to handle the git push later flawlessly

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # Enables high-performance multi-layer caching mechanisms

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/harsha-frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/harsha-frontend:latest
          cache-from: type=gha # Pulls layer caches directly from GitHub Actions storage
          cache-to: type=gha,mode=max # Stores newly built layers securely back to the cache

      - name: Update Frontend Helm Tag
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq && sudo chmod +x /usr/bin/yq
          IMAGE_PATH="${{ secrets.DOCKERHUB_USERNAME }}/harsha-frontend:${{ github.sha }}"
          /usr/bin/yq -i ".frontend.image.tag = \"$IMAGE_PATH\"" helm/yaakai/values/values-dev.yaml

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/yaakai/values/values-dev.yaml
          
          # Only proceed with a git commit and push if the Helm file actually contains differences
          if ! git diff --cached --quiet; then
            git commit -m "deploy frontend SHA: ${{ github.sha }}"
            git pull origin ${{ github.ref_name }} --rebase
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes detected in values-dev.yaml. Skipping repository update."
          fi
