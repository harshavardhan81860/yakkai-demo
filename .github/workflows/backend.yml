name: Backend CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'  # Only trigger if files in the backend folder change
      - 'helm/yaakai/templates/**'
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }} # Use PAT here so the git commit step can push seamlessly

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # Enables advanced multi-layer caching features

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/harsha-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/harsha-backend:latest
          cache-from: type=gha # Pulls cached image layers from GitHub Actions cache
          cache-to: type=gha,mode=max # Saves built layers back to the GitHub cache

      - name: Update Backend Helm Tag
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq && sudo chmod +x /usr/bin/yq
          IMAGE_PATH="ghcr.io/${{ github.repository_owner }}/harsha-backend:${{ github.sha }}"
          /usr/bin/yq -i ".backend.image.tag = \"$IMAGE_PATH\"" helm/yaakai/values/values-dev.yaml

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/yaakai/values/values-dev.yaml
          
          # Only commit and push if the file actually changed
          if ! git diff --cached --quiet; then
            git commit -m "deploy backend SHA: ${{ github.sha }}"
            git pull origin ${{ github.ref_name }} --rebase
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes detected in Helm values. Skipping push."
          fi
