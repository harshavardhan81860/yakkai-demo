name: Backend Build & Deploy

on:
  push:
    branches:
      - prod
    paths:
      - backend/**
      - helm/yaakai/templates/backend*

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: harshavardhan81860/yakkai/backend

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Install yq
        run: |
          sudo wget -q \
          https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
          -O /usr/local/bin/yq

          sudo chmod +x /usr/local/bin/yq

      - name: Update Helm Values
        run: |
          yq -i '.backend.image.tag="${{ github.sha }}"' \
          helm/yaakai/values/values-dev.yaml

      - name: Commit Changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add helm/yakkai/values/values-dev.yaml

          git commit -m "backend image ${{ github.sha }}" || exit 0

          git push
