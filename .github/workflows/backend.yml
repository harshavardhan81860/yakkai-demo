name: Backend DevSecOps CI/CD

on:
  push:
    branches:
      - prod
    paths:
      - backend/**
      - helm/yaakai/templates/backend*
  pull_request: 
    branches: 
      - prod 
    paths: 
      - backend/**
      - helm/yakkai/templates/backend*

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: harshavardhan81860/yakkai/backend
  IMAGE_TAG: ${{ github.sha }}
  HELM_VALUES_FILE: helm/yakkai/values/values-dev.yaml

jobs:
  # =====================================================
  # STAGE 1: SECRET SCANNING
  # =====================================================

  secret-scanning:
    name: 01. Secret Scanning - Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Secret Scan Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-01-gitleaks
          path: gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 90

  # =====================================================
  # STAGE 2: SAST - STATIC APPLICATION SECURITY TESTING
  # =====================================================

  sast-scan:
    name: 02. SAST - Semgrep
    runs-on: ubuntu-latest

    needs: secret-scanning

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Run Semgrep SAST
        run: |
          semgrep scan \
            --config auto \
            --json \
            --output semgrep-sast-report.json

      - name: Upload SAST Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-02-semgrep
          path: semgrep-sast-report.json
          if-no-files-found: ignore
          retention-days: 90

  # =====================================================
  # STAGE 3: SOFTWARE COMPOSITION ANALYSIS
  # Dependency and Filesystem Vulnerability Scan
  # =====================================================

  dependency-scan:
    name: 03. Dependency Scan - Trivy
    runs-on: ubuntu-latest

    needs: secret-scanning

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@v0.30.0
        with:
          scan-type: fs
          scan-ref: ./backend
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-dependency-report.json

      - name: Upload Dependency Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-03-dependency-scan
          path: trivy-dependency-report.json
          if-no-files-found: ignore
          retention-days: 90

  # =====================================================
  # STAGE 4: INFRASTRUCTURE AS CODE SECURITY
  # =====================================================

  iac-security:
    name: 04. IaC Security - Checkov
    runs-on: ubuntu-latest

    needs: secret-scanning

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Checkov
        run: |
          pip3 install checkov

      - name: Run Checkov
        run: |
          checkov \
            -d . \
            --framework terraform,kubernetes \
            --output json \
            --output-file-path checkov-iac-report.json \
            --soft-fail

      - name: Upload IaC Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-04-checkov
          path: checkov-iac-report.json
          if-no-files-found: ignore
          retention-days: 90


  # =====================================================
  # STAGE 5: UNIT TESTS
  # =====================================================

  unit-tests:
    name: 05. Backend Unit Tests
    runs-on: ubuntu-latest

    needs: [sast-scan, dependency-scan]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Assumes the backend is Python.
      # Modify this section if your backend uses Node.js,
      # Java, or another language.

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run Unit Tests
        working-directory: backend
        run: |
          if [ -d tests ]; then
            pip install pytest
            pytest
          else
            echo "No tests directory found. Add unit tests to backend/tests."
          fi


  # =====================================================
  # STAGE 6: BUILD DOCKER IMAGE
  # =====================================================

  build-image:
    name: 06. Build Backend Docker Image
    runs-on: ubuntu-latest

    needs:
      - sast-scan
      - dependency-scan
      - iac-security
      - unit-tests

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Save Docker Image
        run: |
          docker save \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            -o backend-image.tar

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-docker-image
          path: backend-image.tar
          retention-days: 1


  # =====================================================
  # STAGE 7: CONTAINER IMAGE SECURITY
  # =====================================================

  container-security:
    name: 07. Container Security - Trivy
    runs-on: ubuntu-latest

    needs: build-image

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Docker Image
        uses: actions/download-artifact@v4
        with:
          name: backend-docker-image

      - name: Load Docker Image
        run: |
          docker load -i backend-image.tar

      - name: Run Trivy Image Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-container-report.json
          exit-code: "1"

      - name: Upload Container Security Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-07-container-security
          path: trivy-container-report.json
          if-no-files-found: ignore
          retention-days: 90

    # =====================================================
  # STAGE 8: PUSH IMAGE TO GHCR
  # =====================================================

  push-image:
    name: 08. Push Secure Image to GHCR
    runs-on: ubuntu-latest

    needs: container-security

    # Do not push images during pull requests.
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Docker Image
        uses: actions/download-artifact@v4
        with:
          name: backend-docker-image

      - name: Load Docker Image
        run: |
          docker load -i backend-image.tar

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Image
        run: |
          docker push \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}


  # =====================================================
  # STAGE 9: UPDATE HELM VALUES
  # =====================================================

  update-helm:
    name: 09. Update Helm Image Tag
    runs-on: ubuntu-latest

    needs: push-image

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Install yq
        run: |
          sudo wget -q \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 \
            -O /usr/local/bin/yq

          sudo chmod +x /usr/local/bin/yq

      - name: Update Helm Image Tag
        run: |
          test -f "${{ env.HELM_VALUES_FILE }}"

          yq -i \
            '.backend.image.tag = "${{ env.IMAGE_TAG }}"' \
            "${{ env.HELM_VALUES_FILE }}"

      - name: Commit Helm Changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add "${{ env.HELM_VALUES_FILE }}"

          if ! git diff --cached --quiet; then
            git commit -m "backend image ${{ env.IMAGE_TAG }}"

            git pull --rebase origin "${{ github.ref_name }}"

            git push origin HEAD:"${{ github.ref_name }}"
          else
            echo "No Helm changes detected."
          fi


  # =====================================================
  # STAGE 10: AUDIT EVIDENCE PACK
  # =====================================================

  audit-evidence:
    name: 10. Consolidate DevSecOps Evidence
    runs-on: ubuntu-latest

    needs:
      - secret-scanning
      - sast-scan
      - dependency-scan
      - iac-security
      - unit-tests
      - build-image
      - container-security

    if: always()

    steps:
      - name: Download All Evidence
        uses: actions/download-artifact@v4
        with:
          path: audit-evidence-pack

      - name: Generate Audit Manifest
        run: |
          mkdir -p final-evidence-pack

          cp -r audit-evidence-pack/* final-evidence-pack/ 2>/dev/null || true

          echo "DevSecOps Audit Evidence" > final-evidence-pack/MANIFEST.txt
          echo "Repository: $GITHUB_REPOSITORY" >> final-evidence-pack/MANIFEST.txt
          echo "Commit SHA: $GITHUB_SHA" >> final-evidence-pack/MANIFEST.txt
          echo "Triggered By: $GITHUB_ACTOR" >> final-evidence-pack/MANIFEST.txt
          echo "Generated At: $(date -u)" >> final-evidence-pack/MANIFEST.txt

      - name: Upload Complete Evidence Pack
        uses: actions/upload-artifact@v4
        with:
          name: devsecops-audit-evidence-${{ github.sha }}
          path: final-evidence-pack/
          retention-days: 90
