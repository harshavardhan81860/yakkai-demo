{{- if .Values.keycloak.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.keycloak.name }}
spec:
  type: {{ .Values.keycloak.service.type }}
  selector:
    app: {{ .Values.keycloak.name }}
  ports:
    - port: {{ .Values.keycloak.port }}
      targetPort: {{ .Values.keycloak.port }}
{{- end }}
