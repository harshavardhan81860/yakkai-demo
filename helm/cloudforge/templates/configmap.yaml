apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cloudforge.fullname" . }}-config
  labels:
    {{- include "cloudforge.labels" . | nindent 4 }}
data:
  CORS_ORIGINS: {{ .Values.backend.env.corsOrigins | quote }}
  DATABASE_HOST: {{ include "cloudforge.fullname" . }}-postgres
  DATABASE_PORT: {{ .Values.postgresql.service.port | quote }}
  DATABASE_NAME: {{ .Values.postgresql.auth.database | quote }}
  DATABASE_USER: {{ .Values.postgresql.auth.username | quote }}
