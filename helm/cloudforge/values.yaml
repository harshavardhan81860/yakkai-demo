# ─────────────────────────────────────────────
# CloudForge Helm Values
# ─────────────────────────────────────────────

global:
  imageRegistry: ""   # e.g. myacr.azurecr.io

# ── Backend ──
backend:
  replicaCount: 2
  image:
    repository: cloudforge-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    corsOrigins: '["*"]'

# ── Frontend ──
frontend:
  replicaCount: 2
  image:
    repository: cloudforge-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ── PostgreSQL ──
postgresql:
  enabled: true
  replicaCount: 1
  image:
    repository: postgres
    tag: "15-alpine"
  storage:
    size: 10Gi
    storageClassName: managed-premium  # AKS managed premium SSD
  service:
    port: 5432
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  auth:
    database: cloudforge
    username: cloudforge
    # password set via secret

# ── Ingress ──
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
  host: cloudforge.example.com    # Override with your domain
  tls: []
  # - secretName: cloudforge-tls
  #   hosts:
  #     - cloudforge.example.com

# ── Secrets ──
secrets:
  jwtSecretKey: "change-me-in-production"
  postgresPassword: "cloudforge-secret"
