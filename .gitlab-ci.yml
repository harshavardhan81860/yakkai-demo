stages:
  - build

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

  BACKEND_IMAGE_NAME: "registry.gitlab.com/guhatek/yakkai/backend"
  FRONTEND_IMAGE_NAME: "registry.gitlab.com/guhatek/yakkai/frontend"
  IMAGE_TAG: "develop"

before_script:
  - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY

# -------------------------
# Backend build
# -------------------------
build-backend:
  stage: build
  image: docker:24.0.5
  services:
    - name: docker:24.0.5-dind
      command: ["--tls=false"]
  script:
    - echo "Building backend image"
    - docker build -t $BACKEND_IMAGE_NAME:$IMAGE_TAG ./backend
    - docker push $BACKEND_IMAGE_NAME:$IMAGE_TAG
  only:
    - develop

# -------------------------
# Frontend build
# -------------------------
build-frontend:
  stage: build
  image: docker:24.0.5
  services:
    - name: docker:24.0.5-dind
      command: ["--tls=false"]
  script:
    - echo "Building frontend image with BUILD_SCRIPT=build:dev"
    - docker build --build-arg BUILD_SCRIPT=build:dev -t $FRONTEND_IMAGE_NAME:$IMAGE_TAG ./frontend
    - docker push $FRONTEND_IMAGE_NAME:$IMAGE_TAG
  only:
    - develop

